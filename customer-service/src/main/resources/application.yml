server:
    port: 8085

spring:
    application:
        name: customer-service
    datasource:
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://localhost:5432/customer_db
        username: postgres
        password: S1mpL0rd
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
